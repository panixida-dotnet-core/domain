name: CI

on:
    push:
        branches: [ main ]
    pull_request:

permissions:
    contents: read
    packages: write

jobs:
    format:
        uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/dotnet-format.yml@main
        secrets:
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}
        
    tests:
        uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/dotnet-tests.yml@main
        secrets:
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}

    aot:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v7
            with:
              fetch-depth: 0
          - uses: actions/setup-dotnet@v6
            with:
              global-json-file: global.json
          - name: Install Native AOT prerequisites
            run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          - name: Pack the library and bundled generator
            run: |
              dotnet pack src/PANiXiDA.Core.Domain/PANiXiDA.Core.Domain.csproj --configuration Release --output "${{ runner.temp }}/enumeration-packages"
              version="$(dotnet msbuild src/PANiXiDA.Core.Domain/PANiXiDA.Core.Domain.csproj -target:GetNuGetPackageVersion -getProperty:NuGetPackageVersion)"
              echo "DOMAIN_PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          - name: Restore the smoke test from the package
            run: >-
              dotnet restore tests/PANiXiDA.Core.Domain.AotSmoke/PANiXiDA.Core.Domain.AotSmoke.csproj
              -p:UsePackedDomain=true -p:PublishAot=true --runtime linux-x64
              -p:DomainPackageVersion="$DOMAIN_PACKAGE_VERSION"
              -p:RestoreAdditionalProjectSources="${{ runner.temp }}/enumeration-packages"
          - name: Publish Native AOT
            run: >-
              dotnet publish tests/PANiXiDA.Core.Domain.AotSmoke/PANiXiDA.Core.Domain.AotSmoke.csproj
              --configuration Release --no-restore --runtime linux-x64
              -p:UsePackedDomain=true -p:PublishAot=true -p:ILLinkTreatWarningsAsErrors=true
              -p:DomainPackageVersion="$DOMAIN_PACKAGE_VERSION"
              --output "${{ runner.temp }}/enumeration-aot"
          - name: Run the native executable
            run: '"${{ runner.temp }}/enumeration-aot/PANiXiDA.Core.Domain.AotSmoke" --require-aot'

    sonar:
        needs: tests
        uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/dotnet-sonar.yml@main
        with:
          project-key: ${{ vars.SONAR_PROJECT_KEY }}
        secrets:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}

    publish:
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      needs: 
        - format
        - tests
        - aot
        - sonar
      uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/dotnet-publish-global-nuget.yml@main
      secrets:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    notify:
      if: ${{ always() && github.event_name != 'pull_request' }}
      needs: [ publish ]
      uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/notify-telegram.yml@main
      with:
        event-name: ${{ github.event_name }}    
      secrets:
        telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        telegram-chat-id: ${{ vars.TELEGRAM_CHAT_ID }}
        github-token: ${{ secrets.REGISTRY_TOKEN }}
